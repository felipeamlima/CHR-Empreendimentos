<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Title & Description -->
    <title>CHR Empreendimentos e Construções</title>
    <meta name="description" content="CHR Empreendimentos e Construções – Construtora especializada em empreendimentos residenciais e comerciais de alto padrão. Conheça nossos projetos e realize o sonho da casa própria." />

    <!-- SEO: Canonical URL -->
    <link rel="canonical" href="https://chrconstrutora.com.br/" />

    <!-- Favicon: SVG (navegadores modernos) + PNG (fallback) -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1a1a2e" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CHR Empreendimentos e Construções" />
    <meta property="og:title" content="CHR Empreendimentos e Construções" />
    <meta property="og:description" content="Construtora especializada em empreendimentos residenciais e comerciais de alto padrão. Conheça nossos projetos e realize o sonho da casa própria." />
    <meta property="og:url" content="https://chrconstrutora.com.br/" />
    <meta property="og:image" content="https://chrconstrutora.com.br/logo.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CHR Empreendimentos e Construções" />
    <meta name="twitter:description" content="Construtora especializada em empreendimentos residenciais e comerciais de alto padrão. Conheça nossos projetos." />
    <meta name="twitter:image" content="https://chrconstrutora.com.br/logo.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CHR Empreendimentos e Construções",
      "url": "https://chrconstrutora.com.br",
      "logo": "https://chrconstrutora.com.br/logo.png",
      "description": "Construtora especializada em empreendimentos residenciais e comerciais de alto padrão.",
      "sameAs": []
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CHR Empreendimentos e Construções",
      "url": "https://chrconstrutora.com.br"
    }
    </script>

    <!-- Structured Data: SiteNavigationElement (orienta os sitelinks do Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SiteNavigationElement",
          "name": "Empreendimentos",
          "url": "https://chrconstrutora.com.br/empreendimentos"
        },
        {
          "@type": "SiteNavigationElement",
          "name": "Sobre",
          "url": "https://chrconstrutora.com.br/sobre"
        },
        {
          "@type": "SiteNavigationElement",
          "name": "Blog",
          "url": "https://chrconstrutora.com.br/blog"
        },
        {
          "@type": "SiteNavigationElement",
          "name": "Contato",
          "url": "https://chrconstrutora.com.br/contato"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
